# ---------------------------------------------------------------------------
# GitHub cloud build for the AiCode Flutter-article web app (iOS .ipa)
#
# You need NO local Mac. Push this folder to a GitHub repo; the workflow below
# builds the native main program, signs and packages an .ipa on a GitHub-hosted
# macOS runner, and uploads the .ipa as a build artifact.
#
# Secrets (repo -> Settings -> Secrets and variables -> Actions) — all optional:
#   * (none)                     -> ad-hoc signed .ipa. Install on-device via
#                                    AltStore / Sideloadly with a FREE Apple ID
#                                    (ad-hoc runs 7 days, then re-run + re-install).
#   * P12_B64                    -> base64 of your .p12 certificate.
#   * P12_PASSWORD               -> that .p12's password.
#   * PROVISION_PROFILE_B64      -> base64 of an .mobileprovision that matches the
#                                    bundle id + devices. Makes the .ipa directly
#                                    installable (not just via AltStore).
#   P12 export:  Keychain Access -> export "Apple (Development) <id>" as .p12
#                base64:  base64 -i cert.p12        (Linux/macOS)  or  certutil -encode
# ---------------------------------------------------------------------------
name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14        # Apple toolchain lives on this cloud Mac.
    permissions:
      contents: write        # let GITHUB_TOKEN post the auto failure report as a commit comment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build main program (arm64 iOS Mach-O)
        working-directory: app/AiCodeFlutterArticle.app
        run: |
          set -e
          exec > >(tee -a /tmp/build_main.log) 2>&1
          echo "=== toolchain forensics ==="
          xcodebuild -version || true
          swift --version 2>/dev/null | head -1 || true
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iOS SDK: $SDK"
          xcrun -sdk iphoneos swiftc -O -target arm64-apple-ios12.0 \
            -framework UIKit -framework WebKit \
            -F "$SDK/System/iOSSupport/System/Library/Frameworks" \
            -L "$SDK/System/iOSSupport/usr/lib/swift" \
            Source/main.swift -o AiCodeFlutterArticle || {
              echo "swiftc FAILED — SDK/System layout: $(ls "$SDK/System" 2>&1 | head -10)"
              echo "iOSSupport layout: $(ls "$SDK/System/iOSSupport" 2>&1 | head -10)"
              exit 1
            }
          chmod +x AiCodeFlutterArticle
          if command -v file >/dev/null 2>&1; then file AiCodeFlutterArticle; else otool -hv AiCodeFlutterArticle | head -3; fi

      - name: Compile app icon into Assets.car (best-effort)
        working-directory: app/AiCodeFlutterArticle.app
        run: |
          set -e
          mkdir -p build
          xcrun actool --app-icon AppIcon AppIcon.appiconset \
            --compile build --output-format human-readable-text \
            --target-device iphone --minimum-deployment-target 12.0 \
            AppIcon.appiconset || echo "actool step non-fatal"
          AC="$(find build -name Assets.car | head -1)"
          if [ -n "$AC" ]; then cp "$AC" ./Assets.car && echo "compiled Assets.car"; else echo "no Assets.car (will use legacy icons)"; fi

      - name: Codesign (ad-hoc by default; real certificate when P12_B64 set)
        working-directory: app/AiCodeFlutterArticle.app
        run: |
          set -e
          if [ -n "${{ secrets.P12_B64 }}" ]; then
            echo "== real certificate =="
            echo "${{ secrets.P12_B64 }}" | base64 -d > /tmp/app.p12
            KC=/tmp/ci.keychain
            security create-keychain -p ci "$KC"
            security import /tmp/app.p12 -k "$KC" -P "${{ secrets.P12_PASSWORD }}"
            security set-keychain-settings -u "$KC"
            security list-keychains -d user -set "$KC"
            ID="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Development|Distribution/ {print $2; exit}')"
            echo "signing identity: $ID"
            codesign --force --deep --sign "$ID" .
          else
            echo "== ad-hoc (install via AltStore / Sideloadly, free Apple ID) =="
            codesign --force --deep --sign - .
          fi
          codesign --verify --verbose . || true

      - name: Package .ipa
        working-directory: app
        run: |
          set -e
          rm -rf Payload && mkdir Payload
          cp -R AiCodeFlutterArticle.app Payload/
          if [ -n "${{ secrets.PROVISION_PROFILE_B64 }}" ]; then
            echo "${{ secrets.PROVISION_PROFILE_B64 }}" | base64 -d > Payload/embedded.mobileprovision
            echo "embedded provisioning profile -> directly installable .ipa"
          fi
          zip -q -X -r AiCodeFlutterArticle.ipa Payload
          ls -lh AiCodeFlutterArticle.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: AiCodeFlutterArticle
          path: app/AiCodeFlutterArticle.ipa

      - name: Report failure details as commit comment (auto)
        if: failure()
        working-directory: app/AiCodeFlutterArticle.app
        run: |
          set -e
          { echo "### build-ipa auto failure report"; echo '```'; tail -40 /tmp/build_main.log 2>/dev/null || echo "(no build log — failure before build step)"; echo '```'; } > /tmp/build_report.txt
          cat /tmp/build_report.txt
          python3 -c '
          import json, os, urllib.request
          body = open("/tmp/build_report.txt").read()
          tok = os.environ.get("GITHUB_TOKEN", "")
          base = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/commits/" + os.environ["GITHUB_SHA"] + "/comments"
          req = urllib.request.Request(base,
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": "token " + tok,
                       "Accept": "application/vnd.github+json",
                       "User-Agent": "build-ipa-reporter"})
          try:
              r = urllib.request.urlopen(req, timeout=30)
              print("commit comment posted:", r.status)
          except Exception as e:
              print("post commit comment failed (non-fatal):", e)
          '
